name: Execute Ban
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Number'
        required: true

jobs:
  ban:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Sessions
      run: unzip -o sessions.zip
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install @whiskeysockets/baileys pino
      
    - name: Run Ban
      run: node archon_x.js ${{ github.event.inputs.target }} ./sessions 10
